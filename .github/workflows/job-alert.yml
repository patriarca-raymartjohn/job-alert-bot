name: Job Alert Bot

on:
  schedule:
    # Every 15 minutes. Note: GitHub cron is best-effort and often delayed
    # 20-40 min under load — fine here since dedup prevents duplicate alerts.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Needed so the workflow can commit the updated seen.json back to the repo.
permissions:
  contents: write

concurrency:
  # Never let two runs overlap and double-notify.
  group: job-alert-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional overrides (set as repo Variables, not Secrets):
          JOB_KEYWORDS: ${{ vars.JOB_KEYWORDS }}
        run: python main.py

      - name: Commit updated dedup state
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "chore: update seen jobs [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
